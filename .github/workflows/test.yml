name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.txt
      - name: Build installer and check generated source
        run: |
          bash build.sh
          git diff --exit-code -- install.sh
          for script in src/*.sh install.sh; do bash -n "$script"; done
      - name: Offline and terminal regression tests
        run: |
          python tests/test_offline.py
          python tests/test_cli.py -v
          python tests/test_vpn.py -v
      - name: Headscale and Caddy Docker smoke test
        env:
          VPSKIT_RUN_DOCKER_TESTS: '1'
        run: python tests/test_vpn_runtime.py -v
